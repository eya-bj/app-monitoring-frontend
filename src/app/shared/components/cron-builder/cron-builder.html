<div class="cron-builder">

  <!-- Frequency Selector -->
  <div class="form-row">
    <div class="form-field">
      <label class="form-label">Frequency</label>
      <select class="form-select"
        [(ngModel)]="frequency"
        (ngModelChange)="onFrequencyChange()">
        @for (opt of frequencyOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <!-- Every X minutes -->
    @if (frequency === 'minutes') {
      <div class="form-field">
        <label class="form-label">Interval</label>
        <select class="form-select"
          [(ngModel)]="intervalMinutes"
          (ngModelChange)="buildCron()">
          @for (m of minuteOptions; track m) {
            <option [value]="m">{{ m }} min</option>
          }
        </select>
      </div>
    }

    <!-- Every X hours -->
    @if (frequency === 'hours') {
      <div class="form-field">
        <label class="form-label">Interval</label>
        <select class="form-select"
          [(ngModel)]="intervalHours"
          (ngModelChange)="buildCron()">
          @for (h of hourOptions; track h) {
            <option [value]="h">{{ h }} hour{{ h > 1 ? 's' : '' }}</option>
          }
        </select>
      </div>
    }

    <!-- Every day at -->
    @if (frequency === 'daily') {
      <div class="form-field">
        <label class="form-label">Hour</label>
        <select class="form-select"
          [(ngModel)]="dailyHour"
          (ngModelChange)="buildCron()">
          @for (h of hourOfDay; track h) {
            <option [value]="h">{{ h | number:'2.0' }}:00</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Minute</label>
        <select class="form-select"
          [(ngModel)]="dailyMinute"
          (ngModelChange)="buildCron()">
          @for (m of minuteOfHour; track m) {
            <option [value]="m">:{{ m | number:'2.0' }}</option>
          }
        </select>
      </div>
    }

    <!-- Every week on -->
    @if (frequency === 'weekly') {
      <div class="form-field">
        <label class="form-label">Day</label>
        <select class="form-select"
          [(ngModel)]="weeklyDay"
          (ngModelChange)="buildCron()">
          @for (d of dayOptions; track d.value) {
            <option [value]="d.value">{{ d.label }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Hour</label>
        <select class="form-select"
          [(ngModel)]="weeklyHour"
          (ngModelChange)="buildCron()">
          @for (h of hourOfDay; track h) {
            <option [value]="h">{{ h | number:'2.0' }}:00</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Minute</label>
        <select class="form-select"
          [(ngModel)]="weeklyMinute"
          (ngModelChange)="buildCron()">
          @for (m of minuteOfHour; track m) {
            <option [value]="m">:{{ m | number:'2.0' }}</option>
          }
        </select>
      </div>
    }

    <!-- Custom -->
    @if (frequency === 'custom') {
      <div class="form-field flex-2">
        <label class="form-label">Cron Expression</label>
        <input class="form-input" type="text"
          placeholder="0 */5 * * * ?"
          [(ngModel)]="customCron"
          (ngModelChange)="buildCron()" />
      </div>
    }

  </div>

  <!-- Preview -->
  <div class="cron-preview">
    <mat-icon>schedule</mat-icon>
    <div class="preview-info">
      <span class="preview-human">{{ humanReadable() }}</span>
      <span class="preview-cron">{{ cronExpression() }}</span>
    </div>
  </div>

</div>
