<div class="dialog">
  <div class="dialog-header">
    <span class="dialog-title">Add New User</span>
    <button class="icon-btn" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body" [formGroup]="form">

    @if (errorMessage()) {
      <div class="error-banner">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <div class="form-group">
      <label class="form-label">Full Name <span class="required">*</span></label>
      <input
        class="form-input"
        type="text"
        placeholder="Enter full name"
        formControlName="name" />
      @if (form.controls['name'].touched && nameError) {
        <span class="form-error">{{ nameError }}</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label">Email <span class="required">*</span></label>
      <input
        class="form-input"
        type="email"
        placeholder="Enter email address"
        formControlName="email" />
      @if (form.controls['email'].touched && emailError) {
        <span class="form-error">{{ emailError }}</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label">Role <span class="required">*</span></label>
      <select
        class="form-select"
        formControlName="role">
        @for (option of roleOptions; track option.value) {
          @if (isSystemAdmin() || option.value !== 'ADMIN') {
            <option [value]="option.value">{{ option.label }}</option>
          }
        }
      </select>
      @if (!isSystemAdmin()) {
        <span class="form-hint">Only System Admin can assign Admin role.</span>
      }
    </div>

  </div>

  <div class="dialog-footer">
    <button class="btn-secondary" (click)="cancel()">Cancel</button>
    <button class="btn-primary" (click)="submit()" [disabled]="isLoading()">
      @if (isLoading()) {
        <mat-icon class="spin">refresh</mat-icon>
      } @else {
        <mat-icon>person_add</mat-icon>
      }
      {{ isLoading() ? 'Creating...' : 'Add User' }}
    </button>
  </div>
</div>
