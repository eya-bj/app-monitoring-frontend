<div class="reset-container">
  <mat-card class="reset-card">
    <mat-card-header>
      <mat-card-title>Set New Password</mat-card-title>
      <mat-card-subtitle>You must change your default password before continuing</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'"
                 formControlName="newPassword" placeholder="Enter new password"/>
          <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength')">Password must be at least 8 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hideConfirmPassword() ? 'password' : 'text'"
                 formControlName="confirmPassword" placeholder="Confirm new password"/>
          <button mat-icon-button matSuffix (click)="hideConfirmPassword.set(!hideConfirmPassword())" type="button">
            <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="resetForm.get('confirmPassword')?.hasError('required')">Please confirm your password</mat-error>
          <mat-error *ngIf="resetForm.hasError('passwordMismatch')">Passwords do not match</mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage()">
          {{ errorMessage() }}
        </div>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="resetForm.invalid || isLoading()" class="full-width">
          {{ isLoading() ? 'Saving...' : 'Set Password' }}
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
